[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "OptiQS"
version = "0.1.0"
dependencies = ["numpy", "scipy"]

[tool.setuptools.package-dir]
optiqs = "optiqs"

[tool.setuptools.package-data]
optiqs = ["py.typed"]

[project.optional-dependencies]
gpu = ["torch"]
dev = ["mypy", "scipy-stubs", "pytest", "torch"]
